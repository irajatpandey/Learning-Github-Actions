name: my-service-Pipeline
 ß
on:
  push:
    branches:
      - master
      - feature/**
      - release/**
  pull_request:
    branches:
      - master
      - release/**
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.12"

      exclusions:
        description: SonarQube exclusions
        required: false
        type: string
        default: ""
      run-sonar:
        description: Run SonarQube analysis (requires `SONAR_TOKEN` secret)
        required: false
        type: boolean
        default: false

jobs:
  ci-pipeline-jobs:
    uses: irajatpandey/platform-workflows/.github/workflows/python-ci.yml@master
    with:
      exclusions: ${{ inputs.exclusions }}
      run-sonar: ${{ inputs.run-sonar == 'true' || inputs.run-sonar == true }}
    secrets: inherit